name: Watch Tonamel (Xrossstars)

on:
  schedule:
    # 3時間おき。cronはUTC指定なので、日本時間に直すと
    #   8:10 / 11:10 / 14:10 / 17:10 / 20:10 / 23:10 / 2:10 / 5:10
    # 静音時間帯(23〜8時)が明けた直後の 8:10 に実行されるよう、あえてこの並びにしている。
    # （夜のあいだに溜まった通知がここでまとめて届く）
    - cron: "10 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch:
    inputs:
      debug:
        description: "デバッグ出力（画面キャプチャ・APIログ）を残す"
        type: boolean
        default: false
      no_detail:
        description: "詳細ページを開かない（お試し実行用）"
        type: boolean
        default: false
      no_discord:
        description: "Discord通知を送らない"
        type: boolean
        default: false
      respect_quiet:
        description: "静音時間帯（夜間）を手動実行でも尊重する"
        type: boolean
        default: false

# 同時実行を防ぐ（data/ へのpushが衝突しないように）
concurrency:
  group: tonamel-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Tokyo
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SCRAPER_DEBUG: ${{ inputs.debug && '1' || '0' }}
      # 夜間は取得・カレンダー更新はするが、Discord通知だけ朝までためておく
      QUIET_HOURS_ENABLED: "1"
      QUIET_HOURS_START: "23"
      QUIET_HOURS_END: "8"

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Chromium をインストール
        run: python -m playwright install --with-deps chromium

      - name: 大会情報を取得
        id: run
        run: |
          ARGS=""
          if [ "${{ inputs.no_detail }}" = "true" ]; then ARGS="$ARGS --no-detail"; fi
          if [ "${{ inputs.no_discord }}" = "true" ]; then ARGS="$ARGS --no-discord"; fi
          if [ "${{ inputs.debug }}" = "true" ]; then ARGS="$ARGS --debug"; fi
          # 手動実行は動作確認が目的なので、既定では夜間でもすぐ通知する
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.respect_quiet }}" != "true" ]; then
            ARGS="$ARGS --ignore-quiet"
          fi
          python -m src.main $ARGS

      - name: 変更をコミット
        if: always()
        run: |
          if [ -z "$(git status --porcelain data/ docs/)" ]; then
            echo "変更なし。コミットはスキップします。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          git commit -m "chore: 大会データを更新 ($(date '+%Y-%m-%d %H:%M %Z'))"
          # 実行が重なったときのために、pull --rebase してから push する
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "push失敗。リトライします ($i/3)"
            sleep 5
          done
          exit 1

      - name: デバッグ成果物をアップロード
        if: always() && hashFiles('debug/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: debug/
          retention-days: 14

      - name: 失敗時にDiscordへ通知
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          # エラー通知も夜中は鳴らさない（翌朝の実行が成功すれば気づく必要もない）
          HOUR=$(TZ=Asia/Tokyo date +%-H)
          if [ "$HOUR" -ge 23 ] || [ "$HOUR" -lt 8 ]; then
            echo "静音時間帯のため、失敗通知は送りません（$HOUR時）"
            exit 0
          fi
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"⚠️ Xrossstars大会ウォッチャーの実行が失敗しました。\\nログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL" || true
